name: Documentation Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'deploy/DEPLOY.md'
      - 'CHANGELOG.md'
      - 'backend/package.json'
      - 'frontend/public/logo-160.webp'
      - 'frontend/public/fonts/geist/**'
      - 'LICENSE'
      - '.github/workflows/website-pages.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - 'deploy/DEPLOY.md'
      - 'CHANGELOG.md'
      - 'backend/package.json'
      - 'frontend/public/logo-160.webp'
      - 'frontend/public/fonts/geist/**'
      - 'LICENSE'
      - '.github/workflows/website-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install isolated documentation dependencies
        run: npm --prefix website ci
      - name: Build documentation and check links
        env:
          SITE_URL: ${{ vars.DOCS_SITE_URL }}
        run: npm --prefix website run build
      - name: Check deployment configuration
        id: deploy
        if: github.event_name != 'pull_request'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ] && [ -n "$CF_PROJECT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pages credentials not configured; build verified, deployment skipped."
          fi
      - name: Deploy documentation to Pages
        if: steps.deploy.outputs.enabled == 'true'
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: npx --no-install wrangler pages deploy .vitepress/dist --project-name "$PAGES_PROJECT" --branch main
