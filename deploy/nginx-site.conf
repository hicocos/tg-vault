# TG Vault Nginx 单域名示例（旧路由布局）
# 双域名部署还需单独配置 API 站点，映射关系见 deploy/DEPLOY.md。
# 使用前替换域名和证书路径，核对旧路由与缓存规则；不要公共缓存受保护文件。
# Debian/Ubuntu 可复制到 /etc/nginx/sites-available/cloud.example.com，
# 再链接到 sites-enabled；其他发行版使用各自的配置目录。加载前执行 nginx -t。

server {
    listen 80;
    listen [::]:80;
    server_name cloud.example.com;

    # HTTP 重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    # Certbot 验证（如果使用 certbot）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cloud.example.com;

    # SSL 证书路径（请根据实际情况修改）
    ssl_certificate /etc/letsencrypt/live/cloud.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud.example.com/privkey.pem;

    # SSL 配置
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 单次 HTTP 请求上限；应与应用分片/请求限制匹配，不是文件总大小
    client_max_body_size 500M;

    # 前端
    location / {
        proxy_pass http://127.0.0.1:47832;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # 后端 API
    location /api {
        proxy_pass http://127.0.0.1:47832;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache_bypass $http_upgrade;
        
        # 上传超时
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 文件请求经过前端代理，后端端口由 Compose 的 PORT 统一控制。
    location /uploads {
        proxy_pass http://127.0.0.1:47832/uploads;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires off;
    }

    # 受保护文件保留上游缓存策略，不覆盖为公共缓存。
    location /thumbnails {
        proxy_pass http://127.0.0.1:47832/thumbnails;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires off;
    }

    # 旧健康检查路径；部署就绪检查使用 API 的 /readyz
    location /health {
        proxy_pass http://127.0.0.1:47832/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
