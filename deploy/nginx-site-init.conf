# TG Vault Nginx 初始 HTTP 示例（旧的单域名布局，仅用于申请证书）
# 不要通过 HTTP 登录或传输凭证；获取证书后切换到 HTTPS。
# 双域名部署需另配 API 站点；使用前替换域名并核对旧路由，见 deploy/DEPLOY.md。
# 以下为 Debian/Ubuntu 的宿主机命令示例，不是 Compose 服务：
# sudo cp deploy/nginx-site-init.conf /etc/nginx/sites-available/cloud.example.com
# sudo ln -sf /etc/nginx/sites-available/cloud.example.com /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
# sudo certbot --nginx -d cloud.example.com

server {
    listen 80;
    listen [::]:80;
    server_name cloud.example.com;

    # 单次 HTTP 请求上限；应与应用分片/请求限制匹配
    client_max_body_size 500M;

    # 前端
    location / {
        proxy_pass http://127.0.0.1:47832;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # 后端 API
    location /api {
        proxy_pass http://127.0.0.1:47832;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        
        # 上传超时
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 旧文件路径：使用前核对当前路由、鉴权和缓存要求
    location /uploads {
        proxy_pass http://127.0.0.1:47832/uploads;
        proxy_set_header Host $host;
        expires off;
    }

    location /thumbnails {
        proxy_pass http://127.0.0.1:47832/thumbnails;
        proxy_set_header Host $host;
        expires off;
    }

    location /health {
        proxy_pass http://127.0.0.1:47832/health;
    }
}
