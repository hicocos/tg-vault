upstream tg_vault_backend {
    server backend:${PORT};
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
    gzip_comp_level 6;

    # 安全头
    add_header_inherit merge;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data: __API_ORIGIN__; media-src 'self' blob: __API_ORIGIN__; connect-src 'self' __API_ORIGIN__; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # [重要] 优先处理 API 和 静态资源代理 (放在最前面保证高优先级)
    # 使用 ^~ 确保如果匹配到这些路径，就不再检查正则表达式路径
    
    # API 代理
    location ^~ /api {
        proxy_pass http://tg_vault_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 2000M;
    }

    # 静态资源代理
    location ^~ /uploads {
        proxy_pass http://tg_vault_backend;
        client_max_body_size 2000M;
    }

    location ^~ /thumbnails {
        proxy_pass http://tg_vault_backend;
    }

    location = /health {
        proxy_pass http://tg_vault_backend;
    }

    # 静态资源缓存 (放在代理之后)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA shell must revalidate so deployments are visible immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # SPA 路由支持 (放在最后作为兜底)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
